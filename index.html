<body>
    <div class="container">

            <div class="row">
                <form>
                    <h1>Login</h1>
                    <label>Username</label>
                    <br>
                    <input type="text" class="form-control" id="uname">
                    <br>
                    <label>Password</label>
                    <br>
                    <input type="text" class="form-control" id="pwd">

                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" onclick="check()">
                        <label>Remember Me</label>
                    </div>

                    <p id="display"></p>

                    <input type="submit" class="btn btn-primary" onclick="login()">
                    <input type="reset" class="btn btn-secondary"  >
                </form>
            </div>
    </div>   
    
    <script>
        function login(){
            let u=document.getElementById("uname").value;
            let p=document.getElementById("pwd").value;

            if(u==="" || p===""){ 
            alert("Please put the required information.");
        }

        else if(u==="catro67" && p==="12345"){
            alert("Logged in successfully.")
        }
        else{
            alert("Unsuccessful login, Please try again.")
        }
    }
        </script>
